[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1", "toml==0.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree_rl_lab"
version = "0.2.1"
description = "Reinforcement Learning Lab for Unitree Robots."
dependencies = [
    "argcomplete==3.6.3",
    "psutil==5.9.8",
    "qrcode==7.4.2",
]
requires-python = ">=3.11,<3.12"
license = { text = "Apache 2.0" }
authors = [
    { name = "Unitree Robotics" }
]
maintainers = [
    { name = "Unitree Robotics" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux"
]
dynamic = []
